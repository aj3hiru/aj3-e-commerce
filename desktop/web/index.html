<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sri Andal Admin</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #f8f9fb; font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #1f2937; }
  .box { text-align: center; }
  img { width: 180px; height: auto; }
  .bar { width: 160px; height: 3px; margin: 22px auto 0; overflow: hidden; border-radius: 3px; background: #e5e7eb; }
  .bar i { display: block; width: 40%; height: 100%; background: #7c3aed; animation: go 1s ease-in-out infinite; }
  @keyframes go { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  p { margin: 14px 0 0; font-size: 13px; color: #6b7280; }
  button { margin-top: 16px; height: 32px; padding: 0 16px; border: 1px solid #d1d5db; border-radius: 4px; background: #fff; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { background: #f3f4f6; } button:active { background: #e5e7eb; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="box">
  <img src="logo.png" alt="">
  <div class="bar" id="bar"><i></i></div>
  <p id="msg">Opening…</p>
  <button id="retry" class="hide" type="button">Try again</button>
</div>
<script>
  // The admin website itself: every page, the same design. After the first visit the app keeps a copy
  // of every page (desktop-sw.js on the site), so it also opens when the internet is down.
  var START = "https://admin.sriandaltraders.co.in/";
  function go() { location.replace(START); }
  document.getElementById("retry").onclick = go;
  // If the page can't be reached at all (first ever start without internet), say so instead of a blank error.
  setTimeout(function () {
    document.getElementById("bar").className = "bar hide";
    document.getElementById("msg").textContent = "Couldn't reach the store. Check the internet connection — after the first start the app also works offline.";
    document.getElementById("retry").className = "";
  }, 20000);
  go();
</script>
</body>
</html>
