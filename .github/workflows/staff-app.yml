# Builds the staff app (Android APK + Windows installer) and publishes them as a
# GitHub Release "staff-app-v<version>". The website reads the newest release to
# show the "update available" notice and the download page.
name: Staff app

on:
  push:
    branches: [main]
    paths: ["staff_app/**", ".github/workflows/staff-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.38.10"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: staff_app } }
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --update-goldens test/screens_test.dart   # renders every screen (crash check)
      - id: v
        run: echo "version=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')" >> "$GITHUB_OUTPUT"

  android:
    needs: check
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: staff_app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Signing key
        env: { KEY_B64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -z "$KEY_B64" ]; then echo "::error::Add the ANDROID_KEYSTORE_* secrets (see sri-staff-app-signing/README-KEEP-SAFE.txt)"; exit 1; fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk "SriAndalStaff-${{ needs.check.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "staff_app/SriAndalStaff-*.apk" }

  windows:
    needs: check
    runs-on: windows-latest
    defaults: { run: { working-directory: staff_app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ needs.check.outputs.version }}" windows\installer\setup.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "staff_app/build/installer/*.exe" }

  release:
    needs: [check, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: staff-app-v${{ needs.check.outputs.version }}
          name: Sri Andal Staff ${{ needs.check.outputs.version }}
          body: "Staff app for Android (APK) and Windows (installer). Build ${{ github.run_number }}."
          files: out/*
          make_latest: true
